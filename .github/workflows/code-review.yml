name: Spring Boot CI - Code Review Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:

  # ── Job 1: Build & Test ──────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set environment variables
        run: |
          echo "APP_PORT=8080" >> $GITHUB_ENV
          echo "APP_ENV=test" >> $GITHUB_ENV
          echo "DB_CLUSTER_URL=${{ secrets.DB_CLUSTER_URL }}" >> $GITHUB_ENV
          echo "DB_NAME=harmoniedev" >> $GITHUB_ENV
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> $GITHUB_ENV
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "JWT_PRIVATE_KEY=${{ secrets.JWT_PRIVATE_KEY }}" >> $GITHUB_ENV
          echo "JWT_PUBLIC_KEY=${{ secrets.JWT_PUBLIC_KEY }}" >> $GITHUB_ENV
          echo "JWT_ACCESS_TOKEN_EXPIRY_MS=900000" >> $GITHUB_ENV
          echo "JWT_REFRESH_TOKEN_EXPIRY_MS=604800000" >> $GITHUB_ENV
          echo "REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_PORT=6379" >> $GITHUB_ENV
          echo "REDIS_PASSWORD=" >> $GITHUB_ENV
          echo "BCRYPT_STRENGTH=12" >> $GITHUB_ENV
          echo "ALLOWED_ORIGINS=http://localhost:4200" >> $GITHUB_ENV
          echo "MAX_LOGIN_ATTEMPTS=5" >> $GITHUB_ENV
          echo "ACCOUNT_LOCK_DURATION_MINUTES=30" >> $GITHUB_ENV
          echo "ACTUATOR_USERNAME=admin" >> $GITHUB_ENV
          echo "ACTUATOR_PASSWORD=securepassword" >> $GITHUB_ENV

      - name: Start Redis (for tests)
        uses: supercharge/redis-github-action@1.7.0
        with:
          redis-version: 7

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Run Unit Tests
        run: mvn test -B

      - name: Run Integration Tests
        run: mvn verify -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  # ── Job 2: Code Coverage ─────────────────────────────────
  code-coverage:
    name: Code Coverage (JaCoCo)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start Redis
        uses: supercharge/redis-github-action@1.7.0
        with:
          redis-version: 7

      - name: Run tests with coverage
        run: mvn verify jacoco:report -B
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: JaCoCo Coverage Report on PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          title: Code Coverage Report
          update-comment: true

  # ── Job 3: Code Quality (Checkstyle) ─────────────────────
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check -B

      - name: Run SpotBugs
        run: mvn spotbugs:check -B

  # ── Job 4: Security Scan ──────────────────────────────────
  security-scan:
    name: Security Scan (OWASP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: OWASP Dependency Check
        run: |
          mvn dependency-check:check -B \
            -Dnvd.api.key=${{ secrets.NVD_API_KEY }} \
            -Dnvd.api.delay=6000 \
            || true

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore

  # ── Job 5: Docker Build Check ─────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t harmonie-dev-api:test .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: harmonie-dev-api:test
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH